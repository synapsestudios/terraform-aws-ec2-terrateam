version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "America/Phoenix"

  - package-ecosystem: "terraform"
    directory: "/tests/integration"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "America/Phoenix"
    groups:
      terraform-providers:
        patterns: ["*"]
